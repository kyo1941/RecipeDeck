name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude'))

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude PR Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # レビュー専用にするため、push できない権限をトークンで保証する。
          # 既定の GitHub App トークンは contents: write を持ち、上の permissions では制限できない。
          github_token: ${{ github.token }}
          trigger_phrase: "@claude"

          claude_args: |
            --max-turns 20
            --model claude-opus-5-5
            --effort medium
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Act only as a code reviewer. Review the pull request and provide feedback. Do not modify files, create commits, push branches, or implement changes. Post findings about specific lines as inline comments and summarize the review in your main comment. Prefix each finding with its severity: P0 for data loss, security issues, or anything that blocks release, to be fixed immediately. P1 for bugs that break normal use, to be fixed before merge. P2 for defects that occur only under specific conditions, which should preferably be fixed. P3 for minor, optional improvements."
